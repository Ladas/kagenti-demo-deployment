# Kind-specific resource limits
# Kind clusters typically have limited resources
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: grafana
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "200m"
              memory: 512Mi
