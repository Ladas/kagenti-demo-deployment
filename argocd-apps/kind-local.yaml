# ArgoCD Application for Kind Local Environment
# This creates an Application that watches the kind-local environment

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagenti-kind-local
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Source: This GitOps repository
  source:
    repoURL: https://github.com/your-org/kagenti-gitops.git  # UPDATE THIS
    targetRevision: main
    path: environments/kind-local

  # Destination: Local Kind cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  # Sync policy: Automatic with pruning
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
