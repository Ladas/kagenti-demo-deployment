# ArgoCD Application for OpenShift Production Environment
# This creates an Application that watches the openshift-prod environment
# IMPORTANT: Production sync should be manual or require approval

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagenti-openshift-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Source: This GitOps repository
  source:
    repoURL: https://github.com/your-org/kagenti-gitops.git  # UPDATE THIS
    targetRevision: main
    path: environments/openshift-prod

  # Destination: External OpenShift Production cluster
  destination:
    server: https://api.prod-cluster.example.com:6443  # UPDATE THIS
    namespace: observability

  # Sync policy: Manual sync for production (safer)
  syncPolicy:
    # Comment out 'automated' section for manual sync
    # automated:
    #   prune: true
    #   selfHeal: true
    #   allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health assessment
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /status
