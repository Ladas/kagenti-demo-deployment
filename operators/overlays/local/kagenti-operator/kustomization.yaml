apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use upstream kagenti-operator Kustomize config
resources:
  - https://github.com/kagenti/kagenti-operator//kagenti-operator/config/default?ref=v0.2.0-alpha.17

namespace: kagenti-system

# Use pre-built upstream images by default
# Override with localhost:5001/kagenti-operator:dev for local development
images:
  - name: kagenti-operator
    newName: ghcr.io/kagenti/kagenti-operator/kagenti-operator
    newTag: v0.2.0-alpha.17

# Apply local customizations
patches:
  # Fix command path and add necessary configurations
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/0
        value: /manager
      # Add webhook cert path argument
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--webhook-cert-path=/tmp/k8s-webhook-server/serving-certs"
      # Disable Istio sidecar injection for webhook pod
      - op: add
        path: /spec/template/metadata/labels/sidecar.istio.io~1inject
        value: "false"
      # Add POD_NAMESPACE environment variable
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  # Ensure istio-injection label on namespace
  - target:
      kind: Namespace
      name: kagenti-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kagenti-system
        labels:
          istio-injection: enabled
