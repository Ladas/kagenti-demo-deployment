apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use upstream kagenti-operator Kustomize config
resources:
  - https://github.com/kagenti/kagenti-operator//platform-operator/config/default?ref=v0.2.0-alpha.17
  # Add Tekton step ConfigMaps (not included in base Kustomize)
  - tekton-steps.yaml

namespace: kagenti-system

# Use pre-built upstream images by default
# Override with localhost:5001/kagenti-platform-operator:dev for local development
images:
  - name: ko.local/kagenti-operator
    newName: ghcr.io/kagenti/kagenti-operator/kagenti-platform-operator
    newTag: v0.2.0-alpha.17

# Apply local customizations
patches:
  # Fix command path for operator
  - target:
      kind: Deployment
      name: controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/0
        value: /manager
      # Use different secret name to avoid conflict with kagenti-operator
      - op: replace
        path: /spec/template/spec/volumes/0/secret/secretName
        value: kagenti-platform-webhook-cert

  # Ensure istio-injection label on namespace
  - target:
      kind: Namespace
      name: kagenti-system
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: kagenti-system
        labels:
          istio-injection: enabled

  # Change certificate secret name to avoid conflict with kagenti-operator
  - target:
      kind: Certificate
      name: serving-cert
    patch: |-
      - op: replace
        path: /spec/secretName
        value: kagenti-platform-webhook-cert

  # Update webhook CA injection annotation with correct certificate name
  - target:
      kind: MutatingWebhookConfiguration
      name: mutating-webhook-configuration
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: kagenti-system/kagenti-serving-cert

  - target:
      kind: ValidatingWebhookConfiguration
      name: validating-webhook-configuration
    patch: |-
      - op: replace
        path: /metadata/annotations/cert-manager.io~1inject-ca-from
        value: kagenti-system/kagenti-serving-cert
