[pytest]
# Pytest configuration for Kagenti platform tests

# Register custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    critical: marks tests as critical/essential (run with '-m critical')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
    validation: marks tests as validation tests
    manual: marks tests that require manual setup or intervention

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging
log_cli = false
log_cli_level = INFO

# Output options
console_output_style = progress
addopts =
    --strict-markers
    --tb=short
    -v

# Test paths
testpaths = tests

# Asyncio configuration
asyncio_mode = strict
