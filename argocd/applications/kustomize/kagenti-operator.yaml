apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagenti-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    kagenti.dev/layer: infrastructure
    kagenti.dev/component: operators
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ladas/kagenti-demo-deployment
    # TODO: Change to your fork URL
    targetRevision: argocd-gitops-dev
    # TODO: Change to main when ready
    path: operators/overlays/local/kagenti-operator
    # This overlay references the operator repo remotely and patches for local dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kagenti-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
