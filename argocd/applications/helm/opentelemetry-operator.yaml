apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  labels:
    kagenti.dev/layer: infrastructure
    kagenti.dev/component: otel-operator
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.72.0
    helm:
      values: |
        # Manager configuration
        manager:
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Required in v0.72.0+
          collectorImage:
            repository: otel/opentelemetry-collector-k8s
          # Multi-instrumentation is now enabled by default via --enable-multi-instrumentation flag

        # Replicas configuration (moved out of manager in v0.72.0)
        replicaCount: 1

        # Admission webhooks (required for auto-instrumentation)
        admissionWebhooks:
          create: true
          certManager:
            enabled: false  # Use self-signed certificates for Kind
          autoGenerateCert:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
