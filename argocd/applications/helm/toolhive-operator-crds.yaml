# Toolhive Operator CRDs
# StackLok Toolhive for managing MCP Servers
# Required by kagenti-operator (GitHub Issue #78)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toolhive-operator-crds
  namespace: argocd
  labels:
    app.kubernetes.io/name: toolhive-operator-crds
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: operators
  annotations:
    argocd.argoproj.io/sync-wave: "5"  # Wave 5 - Before kagenti-operator (Wave 10)
spec:
  project: default
  source:
    # OCI Helm chart from StackLok GitHub Container Registry
    repoURL: ghcr.io/stacklok/toolhive
    chart: toolhive-operator-crds
    targetRevision: "*"  # Latest version
  destination:
    server: https://kubernetes.default.svc
    # CRDs are cluster-scoped, no specific namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Recommended for CRDs
