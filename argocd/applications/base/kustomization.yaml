# Base Applications
# Shared across all cluster types (Kind, OpenShift)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Wave 0 - Core Infrastructure (Kustomize-based)
  - 00-infrastructure
  - reflector.yaml  # Kubernetes Reflector for OAuth secret mirroring

  # Wave 10 - Operators
  # NOTE: Operators moved to Helm (see ../helm/kagenti-operator.yaml)
  # kagenti-operator replaces platform-operator (Issue #78)

  # Wave 15 - Platform
  - platform.yaml
  - ollama.yaml

  # Wave 20 - Observability
  - observability.yaml

  # Wave 25 - Applications
  # NOTE: agents.yaml removed - agents will be imported dynamically via AgentBuild CRDs
  # See scripts/import-agents-via-ui.sh for agent import workflow

# NOTE: Keycloak and SPIRE are now deployed via Helm (see ../helm/)
# NOTE: Container Registry is deployed via Helm (see ../helm/container-registry.yaml)
