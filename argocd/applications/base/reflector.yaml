apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reflector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"  # Deploy with infrastructure (before Keycloak)
spec:
  project: default
  source:
    repoURL: https://github.com/ladas/kagenti-demo-deployment.git
    targetRevision: argocd-gitops-dev-phase-2
    path: components/00-infrastructure/reflector
  destination:
    server: https://kubernetes.default.svc
    namespace: reflector
  syncPolicy:
    # NO automated sync - let root app control sync order via sync waves
    syncOptions:
    - CreateNamespace=true
