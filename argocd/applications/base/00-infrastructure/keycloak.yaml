apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    kagenti.dev/layer: infrastructure
    kagenti.dev/component: auth
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ladas/kagenti-demo-deployment.git
    targetRevision: argocd-gitops-dev-phase-2
    path: environments/kind-local/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    # NO automated sync - let root app control sync order via sync waves
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
