# Cross-Namespace RBAC for Keycloak Platform Integration
# Enables Keycloak jobs to copy secrets to platform namespaces
#
# Sync wave: 0 (deployed before Keycloak Application which runs at wave 5)

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-platform-rbac
  namespace: argocd
  labels:
    layer: infrastructure
    component: auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/ladas/kagenti-demo-deployment.git
    targetRevision: argocd-gitops-dev
    path: components/00-infrastructure/keycloak-platform-rbac
  destination:
    server: https://kubernetes.default.svc
    # NO namespace field - component has explicit namespace declarations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false  # Namespaces (keycloak, kagenti-system) already exist
