# Base Observability Application
# Reusable across Kind and OpenShift
# Cluster-specific values are set via Kustomize patches

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    kagenti.dev/layer: observability
spec:
  project: default

  source:
    repoURL: https://github.com/Ladas/kagenti-demo-deployment.git
    targetRevision: argocd-gitops-dev-phase-2
    path: components/02-observability

  destination:
    server: SET_IN_OVERLAY  # Patched per cluster
    namespace: default

  syncPolicy:
    # NO automated sync - let root app control sync order via sync waves
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  ignoreDifferences:
    - group: "*"
      kind: Secret
      jsonPointers:
        - /data
    - group: "*"
      kind: ServiceAccount
      jsonPointers:
        - /secrets
    - group: "batch"
      kind: Job
      jsonPointers:
        - /spec/template/metadata/labels
        - /status
