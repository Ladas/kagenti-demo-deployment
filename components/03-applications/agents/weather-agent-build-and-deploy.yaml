# Weather Service Agent - AgentBuild + Agent CRDs
# Replaces static Deployment with kagenti-operator managed resources
# Reference: https://github.com/kagenti/kagenti-operator/issues/78

---
# AgentBuild CRD - Triggers Tekton pipeline to build weather-service image
apiVersion: agent.kagenti.dev/v1alpha1
kind: AgentBuild
metadata:
  name: weather-service-build
  namespace: team1
  labels:
    app: weather-service
    ai.openshift.io/agent.class: "a2a"
    ai.openshift.io/agent.name: "weather-service"
spec:
  # dev mode: uses dev pipeline template
  mode: dev

  # Source repository configuration (public repo - no credentials needed)
  source:
    sourceRepository: "github.com/kagenti/agent-examples.git"
    sourceRevision: "main"
    sourceSubfolder: "a2a/weather_service"

  # Tekton pipeline configuration
  pipeline:
    namespace: kagenti-system

  # Build output configuration
  buildOutput:
    image: "weather-service"
    imageTag: "v0.0.1"
    imageRegistry: "localhost:5000"
    # Note: No imageRepoCredentials needed for local registry

---
# Agent CRD - Deploys weather-service using image built by AgentBuild
apiVersion: agent.kagenti.dev/v1alpha1
kind: Agent
metadata:
  name: weather-service
  namespace: team1
  labels:
    app: weather-service
    ai.openshift.io/agent.class: "a2a"
    ai.openshift.io/agent.name: "weather-service"
  annotations:
    description: "Weather agent using LangGraph and MCP tools"
spec:
  description: "Weather agent using LangGraph and MCP tools"
  replicas: 1

  # Reference AgentBuild for image
  imageSource:
    buildRef:
      name: weather-service-build

  # Service ports (Agent CRD creates Service automatically)
  servicePorts:
    - name: a2a
      port: 8000
      protocol: TCP
      targetPort: 8000

  # Complete pod template specification
  podTemplateSpec:
    spec:
      serviceAccountName: default
      containers:
      - name: agent  # Fixed name "agent" for main container
        # image: will be replaced by kagenti-operator with image from AgentBuild

        # Container ports
        ports:
        - containerPort: 8000
          name: a2a
          protocol: TCP

        # Environment variables
        env:
        # Server configuration
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: UV_CACHE_DIR
          value: "/app/.cache/uv"

        # LLM configuration (Ollama)
        - name: LLM_API_BASE
          value: "http://ollama.kagenti-system.svc.cluster.local:11434/v1"
        - name: LLM_MODEL
          value: "qwen2.5:7b"
        - name: LLM_API_KEY
          value: "not-needed"

        # MCP Weather Tool endpoint
        - name: MCP_URL
          value: "http://weather-mcp-tool.team1.svc.cluster.local:8001/mcp"
        - name: MCP_TRANSPORT
          value: "streamable_http"

        # OpenTelemetry configuration
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "weather-service"

        # Phoenix project assignment (for multi-tenancy)
        - name: PHOENIX_PROJECT_NAME
          value: "team1-agents"

        # Resource limits
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        # Volume mounts for cache
        volumeMounts:
        - mountPath: /app/.cache
          name: cache

      # Volumes
      volumes:
      - name: cache
        emptyDir: {}
