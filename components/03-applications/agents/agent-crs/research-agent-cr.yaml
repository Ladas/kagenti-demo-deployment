apiVersion: agent.kagenti.dev/v1alpha1
kind: Agent
metadata:
  name: research-agent
  namespace: team1
  labels:
    app: research-agent
    ai.openshift.io/agent.class: "a2a"
    ai.openshift.io/agent.name: "research-agent"
spec:
  # Agent image (will be built via AgentBuild CR or pushed manually)
  image: registry.container-registry.svc.cluster.local:5000/research-agent:v0.0.15

  # Service configuration
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    protocol: TCP
    name: a2a

  # Deployment configuration
  deployment:
    replicas: 1
    serviceAccountName: default

    # Container spec
    container:
      name: agent
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
          name: a2a
          protocol: TCP

      # Environment variables
      env:
        - name: A2A_HOST
          value: "0.0.0.0"
        - name: A2A_PORT
          value: "8080"
        - name: llm_api_base
          value: "http://ollama.kagenti-system.svc.cluster.local:11434/v1"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4317"
        - name: OTEL_SERVICE_NAME
          value: "research-agent"

      # Resource limits
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
