apiVersion: v1
kind: Service
metadata:
  name: weather-mcp-tool
  namespace: team1
  labels:
    app: weather-mcp-tool
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: mcp
  selector:
    app: weather-mcp-tool
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-mcp-tool
  namespace: team1
  labels:
    app: weather-mcp-tool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-mcp-tool
  template:
    metadata:
      labels:
        app: weather-mcp-tool
    spec:
      serviceAccountName: default
      containers:
      - name: mcp-tool
        image: localhost:5001/weather-mcp-tool:v0.0.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: mcp
          protocol: TCP
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8001"
        - name: MCP_TRANSPORT
          value: "streamable-http"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 10
