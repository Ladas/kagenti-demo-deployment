# Weather MCP Tool - AgentBuild + Agent CRDs
# Provides weather data via MCP protocol
# Reference: https://github.com/kagenti/agent-examples/tree/main/mcp/weather_tool

---
# AgentBuild CRD - Triggers Tekton pipeline to build weather-mcp-tool image
apiVersion: agent.kagenti.dev/v1alpha1
kind: AgentBuild
metadata:
  name: weather-mcp-tool-build
  namespace: team1
  labels:
    app: weather-tool
    kagenti.io/type: tool
    kagenti.io/protocol: mcp
spec:
  # dev mode: uses dev pipeline template
  mode: dev

  # Source repository configuration (public repo - no credentials needed)
  source:
    sourceRepository: "github.com/kagenti/agent-examples.git"
    sourceRevision: "main"
    sourceSubfolder: "mcp/weather_tool"

  # Tekton pipeline configuration
  pipeline:
    namespace: kagenti-system

  # Build output configuration
  buildOutput:
    image: "weather-mcp-tool"
    imageTag: "v0.0.1"
    imageRegistry: "localhost:5000"
    # Note: No imageRepoCredentials needed for local registry

---
# Agent CRD - Deploys weather-mcp-tool using image built by AgentBuild
apiVersion: agent.kagenti.dev/v1alpha1
kind: Agent
metadata:
  name: weather-mcp-tool
  namespace: team1
  labels:
    app: weather-tool
    kagenti.io/type: tool
    kagenti.io/protocol: mcp
  annotations:
    description: "Weather MCP tool providing weather data"
spec:
  description: "Weather MCP tool providing weather data"
  replicas: 1

  # Reference AgentBuild for image
  imageSource:
    buildRef:
      name: weather-mcp-tool-build

  # Service ports (Agent CRD creates Service automatically)
  servicePorts:
    - name: mcp
      port: 8001
      protocol: TCP
      targetPort: 8001

  # Complete pod template specification
  podTemplateSpec:
    spec:
      serviceAccountName: default
      containers:
      - name: agent  # Fixed name "agent" for main container
        # image: will be replaced by kagenti-operator with image from AgentBuild

        # Container ports
        ports:
        - containerPort: 8001
          name: mcp
          protocol: TCP

        # Environment variables
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8001"
        - name: MCP_TRANSPORT
          value: "streamable-http"
        - name: LOG_LEVEL
          value: "INFO"
        - name: UV_CACHE_DIR
          value: "/tmp/.cache/uv"

        # Resource limits
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Volume mounts for cache
        volumeMounts:
        - name: cache
          mountPath: /tmp/.cache

      # Volumes
      volumes:
      - name: cache
        emptyDir: {}
