apiVersion: agent.kagenti.dev/v1alpha1
kind: AgentBuild
metadata:
  name: code-agent-build
  namespace: team1
  labels:
    app: code-agent
    build-type: tekton
spec:
  # Source repository configuration
  source:
    sourceRepository: "github.com/Ladas/agent-examples-local.git"
    sourceRevision: "main"
    sourceSubfolder: "a2a/code-agent"
    sourceCredentials:
      name: github-token-secret

  # Tekton pipeline configuration
  pipeline:
    namespace: kagenti-system
    parameters:
    - name: SOURCE_REPO_SECRET
      value: github-token-secret

  # Build output configuration
  buildOutput:
    image: "code-agent"
    imageTag: "v0.0.15"
    imageRegistry: "registry.container-registry.svc.cluster.local:5000"

  # Cleanup after build (optional)
  cleanupAfterBuild: true

  # Development mode (uses internal registry, simplified build)
  mode: dev
