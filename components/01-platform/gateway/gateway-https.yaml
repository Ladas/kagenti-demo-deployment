---
# HTTPS Gateway with TLS termination using wildcard certificate
# This patches the existing HTTP gateway to add an HTTPS listener
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http
  namespace: kagenti-system
spec:
  gatewayClassName: istio
  listeners:
  # Keep HTTP listener
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            shared-gateway-access: "true"

  # HTTPS listener with wildcard certificate
  - name: https
    hostname: "*.localtest.me"
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: localtest-me-tls
        kind: Secret
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            shared-gateway-access: "true"

---
# HTTPS Gateway Service on NodePort 30443
# Exposes HTTPS gateway on host port 9443 (mapped to NodePort 30443)
apiVersion: v1
kind: Service
metadata:
  name: https-istio-np
  namespace: kagenti-system
  labels:
    gateway.networking.k8s.io/gateway-name: http
    kagenti.gitops/component: gateway-https
spec:
  type: NodePort
  ports:
  - port: 443
    targetPort: 443
    nodePort: 30443
    protocol: TCP
    name: https
  selector:
    gateway.networking.k8s.io/gateway-name: http
