# TLS Component - Certificate Management
# Manages wildcard certificate for *.localtest.me using cert-manager

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kagenti-system

resources:
  - localtest-me-certificate.yaml

labels:
  - pairs:
      app.kubernetes.io/name: certificates
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  config.kubernetes.io/origin: |
    path: components/platform/tls/kustomization.yaml
