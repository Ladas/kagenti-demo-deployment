# HTTPRoute for SPIRE Tornjak UI
# Provides web interface for SPIRE management
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spire-tornjak
  namespace: spire-system
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
  hostnames:
  - spire.localtest.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: spire-tornjak-frontend
      port: 3000
---
# HTTPRoute for SPIRE Tornjak API
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spire-tornjak-api
  namespace: spire-system
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
  hostnames:
  - spire-api.localtest.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: spire-server
      port: 8081
---
# HTTPRoute for SPIFFE OIDC Discovery
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spiffe-oidc
  namespace: spire-system
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
  hostnames:
  - spiffe-oidc.localtest.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: spiffe-oidc-discovery-provider
      port: 8080
