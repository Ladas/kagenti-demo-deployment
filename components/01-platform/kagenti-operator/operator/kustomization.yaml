# Kagenti Platform Operator Component
# Core Kagenti operator that manages agent lifecycle
#
# Installed via Helm chart from kagenti repository
# Ref: https://github.com/kagenti/kagenti-operator

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kagenti-system

resources:
  - namespace.yaml

# Helm chart installation via Kustomize (using local chart)
# Chart source: https://github.com/kagenti/kagenti-operator
# Note: Requires Kustomize v4.1.0+ with Helm chart support
helmCharts:
  - name: platform-operator
    repo: oci://ghcr.io/kagenti/charts
    version: 0.2.0-alpha.15
    releaseName: kagenti-operator
    namespace: kagenti-system
    includeCRDs: true
    valuesInline:
      # Default values - can be overridden in environment overlays
      replicaCount: 1
      image:
        pullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi

labels:
  - pairs:
      app.kubernetes.io/name: kagenti-operator
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: platform
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  config.kubernetes.io/origin: |
    path: components/platform/operator/kustomization.yaml
