# Kagenti UI OAuth Secret Generator Job
# Automatically creates OAuth2 client in Keycloak and stores credentials as Kubernetes Secret
# Runs as a post-install job after Keycloak is ready

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagenti-ui-oauth-config
  namespace: kagenti-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kagenti-ui-oauth-config
  namespace: kagenti-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update", "patch", "get", "list"]
---
# Role to read Keycloak admin credentials from keycloak namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kagenti-ui-oauth-keycloak-reader
  namespace: keycloak
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["keycloak-initial-admin"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kagenti-ui-oauth-keycloak-reader
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kagenti-ui-oauth-keycloak-reader
subjects:
- kind: ServiceAccount
  name: kagenti-ui-oauth-config
  namespace: kagenti-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kagenti-ui-oauth-config
  namespace: kagenti-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kagenti-ui-oauth-config
subjects:
- kind: ServiceAccount
  name: kagenti-ui-oauth-config
  namespace: kagenti-system
---
# ClusterRole for querying Keycloak pods across namespaces
# Init container needs to check if Keycloak pod is Ready before main job runs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kagenti-ui-oauth-pod-reader
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagenti-ui-oauth-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagenti-ui-oauth-pod-reader
subjects:
- kind: ServiceAccount
  name: kagenti-ui-oauth-config
  namespace: kagenti-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kagenti-ui-oauth-script
  namespace: kagenti-system
data:
  configure-oauth.sh: |
    #!/bin/bash
    set -e

    KEYCLOAK_URL="${KEYCLOAK_URL:-http://keycloak.keycloak.svc:8080}"
    ADMIN_USER="${KEYCLOAK_ADMIN:-admin}"
    ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD:-admin}"
    REALM="kagenti"
    CLIENT_ID="kagenti-ui"
    REDIRECT_URI="https://kagenti.localtest.me:9443/oauth2/callback"

    echo "=== Kagenti UI OAuth Configuration (Idempotent) ==="
    echo ""

    # Get admin token with retry logic
    echo "1. Getting admin token from Keycloak..."
    MAX_RETRIES=5
    RETRY_COUNT=0
    TOKEN=""

    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=${ADMIN_USER}" \
        -d "password=${ADMIN_PASSWORD}" \
        -d "grant_type=password" \
        -d "client_id=admin-cli" 2>&1 | jq -r '.access_token // empty' 2>/dev/null)

      if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
        echo "✓ Got admin token (attempt $((RETRY_COUNT + 1)))"
        break
      fi

      RETRY_COUNT=$((RETRY_COUNT + 1))
      if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
        echo "  Retry $RETRY_COUNT/$MAX_RETRIES - waiting 5 seconds..."
        sleep 5
      fi
    done

    if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
      echo "ERROR: Failed to get admin token after $MAX_RETRIES attempts"
      echo "  Keycloak URL: ${KEYCLOAK_URL}"
      echo "  Check if Keycloak is ready and credentials are correct"
      exit 1
    fi

    # Check if kagenti realm exists
    echo ""
    echo "2. Checking if kagenti realm exists..."
    REALM_EXISTS=$(curl -s -X GET "${KEYCLOAK_URL}/admin/realms/${REALM}" \
      -H "Authorization: Bearer ${TOKEN}" | jq -r '.realm // empty')

    if [ -z "$REALM_EXISTS" ]; then
      echo "  Creating kagenti realm..."
      curl -s -X POST "${KEYCLOAK_URL}/admin/realms" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d '{
          "realm": "kagenti",
          "enabled": true,
          "displayName": "Kagenti Platform"
        }' > /dev/null
      echo "  ✓ Realm created"
    else
      echo "  ✓ Realm already exists"
    fi

    # Check if client exists
    echo ""
    echo "3. Processing ${CLIENT_ID} client..."
    CLIENT_UUID=$(curl -s -X GET "${KEYCLOAK_URL}/admin/realms/${REALM}/clients" \
      -H "Authorization: Bearer ${TOKEN}" | jq -r ".[] | select(.clientId==\"${CLIENT_ID}\") | .id")

    if [ -n "$CLIENT_UUID" ] && [ "$CLIENT_UUID" != "null" ]; then
      echo "  ✓ Client ${CLIENT_ID} already exists (UUID: ${CLIENT_UUID})"
    else
      echo "  Creating client ${CLIENT_ID}..."
      curl -s -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/clients" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"clientId\": \"${CLIENT_ID}\",
          \"name\": \"Kagenti UI\",
          \"description\": \"Kagenti platform web interface\",
          \"enabled\": true,
          \"protocol\": \"openid-connect\",
          \"publicClient\": false,
          \"bearerOnly\": false,
          \"standardFlowEnabled\": true,
          \"implicitFlowEnabled\": false,
          \"directAccessGrantsEnabled\": false,
          \"redirectUris\": [
            \"${REDIRECT_URI}\",
            \"https://kagenti.localtest.me:9443/*\"
          ],
          \"webOrigins\": [
            \"https://kagenti.localtest.me:9443\"
          ]
        }" > /dev/null

      echo "  ✓ Client ${CLIENT_ID} created"

      # Get the UUID of the newly created client
      CLIENT_UUID=$(curl -s -X GET "${KEYCLOAK_URL}/admin/realms/${REALM}/clients" \
        -H "Authorization: Bearer ${TOKEN}" | jq -r ".[] | select(.clientId==\"${CLIENT_ID}\") | .id")
    fi

    # Get the client secret
    echo ""
    echo "4. Getting client secret from Keycloak..."
    CLIENT_SECRET=$(curl -s -X GET "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${CLIENT_UUID}/client-secret" \
      -H "Authorization: Bearer ${TOKEN}" | jq -r '.value')

    # If secret is null, regenerate it
    if [ -z "$CLIENT_SECRET" ] || [ "$CLIENT_SECRET" = "null" ]; then
      echo "  Secret is null, regenerating..."
      curl -s -X POST "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${CLIENT_UUID}/client-secret" \
        -H "Authorization: Bearer ${TOKEN}" > /dev/null
      CLIENT_SECRET=$(curl -s -X GET "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${CLIENT_UUID}/client-secret" \
        -H "Authorization: Bearer ${TOKEN}" | jq -r '.value')
    fi

    if [ -z "$CLIENT_SECRET" ] || [ "$CLIENT_SECRET" = "null" ]; then
      echo "ERROR: Failed to get client secret from Keycloak"
      exit 1
    fi

    echo "  ✓ Got client secret: ${CLIENT_SECRET:0:8}...${CLIENT_SECRET: -8}"

    # Check if K8s secret already exists and compare
    # Use curl to Kubernetes API instead of kubectl to avoid fsnotify issues
    echo ""
    echo "5. Checking existing Kubernetes secret..."
    NAMESPACE="kagenti-system"
    SECRET_NAME="kagenti-ui-oauth-secret"
    K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
    K8S_API="https://kubernetes.default.svc"

    EXISTING_SECRET=$(curl -sk -H "Authorization: Bearer ${K8S_TOKEN}" \
      "${K8S_API}/api/v1/namespaces/${NAMESPACE}/secrets/${SECRET_NAME}" 2>/dev/null \
      | jq -r '.data.CLIENT_SECRET // empty' 2>/dev/null \
      | base64 -d 2>/dev/null || echo "")

    if [ -n "$EXISTING_SECRET" ]; then
      if [ "$EXISTING_SECRET" = "$CLIENT_SECRET" ]; then
        echo "  ✓ Secret already exists and matches Keycloak (no update needed)"
        echo ""
        echo "=== Configuration Complete (No Changes) ==="
        exit 0
      else
        echo "  ⚠ Secret exists but differs from Keycloak"
        echo "    Keycloak: ${CLIENT_SECRET:0:8}...${CLIENT_SECRET: -8}"
        echo "    K8s:      ${EXISTING_SECRET:0:8}...${EXISTING_SECRET: -8}"
        echo "  → Will update secret to match Keycloak"
      fi
    else
      echo "  → Secret does not exist, will create"
    fi

    # Shutdown Istio sidecar before kubectl operations
    # (kubectl fails with "connection reset" when Istio proxy intercepts K8s API traffic)
    echo ""
    echo "6. Shutting down Istio sidecar before kubectl operations..."
    curl -sf -X POST http://localhost:15020/quitquitquit || true
    echo "✓ Istio sidecar shutdown requested"
    sleep 2  # Wait for sidecar to terminate

    # Create/Update Kubernetes secret (idempotent)
    echo ""
    echo "7. Creating/Updating Kubernetes secret..."

    kubectl create secret generic kagenti-ui-oauth-secret \
      --from-literal=CLIENT_ID="${CLIENT_ID}" \
      --from-literal=CLIENT_SECRET="${CLIENT_SECRET}" \
      --from-literal=AUTH_ENDPOINT="https://keycloak.localtest.me:9443/realms/${REALM}/protocol/openid-connect/auth" \
      --from-literal=TOKEN_ENDPOINT="http://keycloak.keycloak.svc.cluster.local:8080/realms/${REALM}/protocol/openid-connect/token" \
      --from-literal=REDIRECT_URI="${REDIRECT_URI}" \
      --from-literal=SCOPE="openid profile email" \
      --namespace=kagenti-system \
      --dry-run=client -o yaml | kubectl apply --validate=false -f -

    # Verify the secret was created/updated correctly
    # Use curl to Kubernetes API instead of kubectl to avoid fsnotify issues
    FINAL_SECRET=$(curl -sk -H "Authorization: Bearer ${K8S_TOKEN}" \
      "${K8S_API}/api/v1/namespaces/${NAMESPACE}/secrets/${SECRET_NAME}" 2>/dev/null \
      | jq -r '.data.CLIENT_SECRET // empty' 2>/dev/null \
      | base64 -d 2>/dev/null || echo "")

    if [ "$FINAL_SECRET" = "$CLIENT_SECRET" ]; then
      echo "  ✓ Kubernetes secret created/updated successfully"
      echo "  ✓ Verified: Secret matches Keycloak"
    else
      echo "  ✗ ERROR: Secret verification failed"
      echo "    Expected: ${CLIENT_SECRET:0:8}...${CLIENT_SECRET: -8}"
      echo "    Got:      ${FINAL_SECRET:0:8}...${FINAL_SECRET: -8}"
      exit 1
    fi

    echo ""
    echo "=== Configuration Complete (SUCCESS) ==="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kagenti-ui-oauth-config
  namespace: kagenti-system
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: kagenti-ui-oauth-config
      annotations:
        # ENABLE Istio sidecar for mTLS connection to Keycloak
        # Keycloak has STRICT mTLS mode, so this job needs a sidecar
        # to encrypt HTTP traffic when connecting to Keycloak service
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: kagenti-ui-oauth-config
      restartPolicy: OnFailure
      initContainers:
      # Wait for Keycloak to be ready
      # Check if Keycloak pod is Ready via Kubernetes API
      - name: wait-for-keycloak
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Keycloak pod to be ready..."
          until kubectl wait --for=condition=Ready pod -l app=keycloak -n keycloak --timeout=10s 2>/dev/null; do
            echo "Keycloak pod not ready yet, waiting..."
            sleep 5
          done
          echo "Keycloak pod is ready!"
      containers:
      - name: configure
        image: alpine/k8s:1.28.3
        command: ["/bin/bash", "/scripts/configure-oauth.sh"]
        env:
        - name: KEYCLOAK_URL
          value: "http://keycloak.keycloak.svc:8080"
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-initial-admin
              key: username
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-initial-admin
              key: password
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: kagenti-ui-oauth-script
          defaultMode: 0555
