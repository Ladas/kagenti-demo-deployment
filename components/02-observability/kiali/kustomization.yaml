# Kiali Service Mesh Observability Component
# Service mesh visualization and traffic analysis
#
# Pre-rendered Kiali Helm chart v2.4.0
# Ref: https://kiali.io/docs/installation/installation-guide/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kiali-system

resources:
  - kiali-rendered.yaml
  - httproute.yaml
  - mtls-policy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: kiali
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: observability
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  config.kubernetes.io/origin: |
    path: components/observability/kiali/kustomization.yaml
