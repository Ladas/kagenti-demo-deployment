# Korrel8r Deployment
# Signal correlation engine for observability (traces, logs, metrics)
# Ref: https://korrel8r.github.io/korrel8r/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: korrel8r
  namespace: observability
  labels:
    app: korrel8r
    app.kubernetes.io/name: korrel8r
    app.kubernetes.io/component: correlation
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: korrel8r
  template:
    metadata:
      labels:
        app: korrel8r
        app.kubernetes.io/name: korrel8r
        app.kubernetes.io/component: correlation
    spec:
      serviceAccountName: korrel8r
      containers:
      - name: korrel8r
        image: quay.io/korrel8r/korrel8r:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: KORREL8R_VERBOSE
          value: "true"
        - name: KORREL8R_CONFIG
          value: "/etc/korrel8r/korrel8r.yaml"
        volumeMounts:
        - name: config
          mountPath: /etc/korrel8r
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/v1alpha1/graphs
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1alpha1/graphs
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: korrel8r-config
---
# ServiceAccount for Korrel8r
apiVersion: v1
kind: ServiceAccount
metadata:
  name: korrel8r
  namespace: observability
  labels:
    app: korrel8r
