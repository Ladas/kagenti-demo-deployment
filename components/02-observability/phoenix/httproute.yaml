---
# Phoenix HTTPS HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phoenix
  namespace: observability
  labels:
    app: phoenix
    app.kubernetes.io/name: phoenix
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: observability
spec:
  parentRefs:
    - name: external-gateway
      namespace: default
      sectionName: https  # Use HTTPS listener
  hostnames:
    - "phoenix.localtest.me"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: phoenix
          port: 6006

---
# HTTP to HTTPS redirect for Phoenix
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phoenix-http-redirect
  namespace: observability
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: http-redirect
  hostnames:
  - "phoenix.localtest.me"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
