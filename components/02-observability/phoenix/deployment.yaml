---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: observability
  labels:
    app: phoenix
    app.kubernetes.io/name: phoenix
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          ports:
            - containerPort: 6006
              name: http
              protocol: TCP
          env:
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_HOST
              value: "0.0.0.0"
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 50m      # Reduced for CI (allows overcommit)
              memory: 128Mi # Reduced for CI
          livenessProbe:
            httpGet:
              path: /
              port: 6006
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 6006
            initialDelaySeconds: 10
            periodSeconds: 5
