# Strict mTLS for observability namespace
# Ensures all service-to-service communication is encrypted
#
# Note: Services accessed via OAuth2-Proxy need PERMISSIVE mTLS on their
# application ports because OAuth2-Proxy connects using plain HTTP
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: observability
spec:
  mtls:
    mode: STRICT
---
# Allow OAuth2-Proxy to connect to Phoenix without mTLS on port 6006
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: phoenix-permissive
  namespace: observability
spec:
  selector:
    matchLabels:
      app: phoenix
  mtls:
    mode: PERMISSIVE
  portLevelMtls:
    "6006":
      mode: PERMISSIVE
---
# Allow OAuth2-Proxy to connect to Tempo Query (Jaeger UI) without mTLS on port 16686
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: tempo-query-permissive
  namespace: observability
spec:
  selector:
    matchLabels:
      app: tempo-query
  mtls:
    mode: PERMISSIVE
  portLevelMtls:
    "16686":
      mode: PERMISSIVE
