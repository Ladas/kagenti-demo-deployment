apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
  labels:
    shared-gateway-access: "true"
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: https  # Use HTTPS listener
  hostnames:
  - "grafana.localtest.me"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grafana
      port: 3000

---
# HTTP to HTTPS redirect for Grafana
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http-redirect
  namespace: observability
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: http-redirect
  hostnames:
  - "grafana.localtest.me"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
