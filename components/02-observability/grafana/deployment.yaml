apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    istio.io/dataplane-mode: ambient
    istio-injection: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc:9090
        isDefault: true
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: 30s
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc:3200
        uid: tempo
        editable: true
        jsonData:
          httpMethod: GET
          # Trace → Log correlation
          tracesToLogsV2:
            datasourceUid: 'loki'
            spanStartTimeShift: '-1h'
            spanEndTimeShift: '1h'
            filterByTraceID: true
            filterBySpanID: false
            customQuery: false
            tags:
              - key: 'service.name'
                value: 'app'
          # Trace → Metric correlation
          tracesToMetrics:
            datasourceUid: 'otel-metrics'
            queries:
              - name: 'Sample query'
                query: 'sum(rate(traces_spanmetrics_latency_bucket{$$__tags}[5m]))'
          serviceMap:
            datasourceUid: 'otel-metrics'
          nodeGraph:
            enabled: true
          search:
            hide: false
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-query-frontend.observability.svc:3100
        uid: loki
        editable: true
        jsonData:
          httpMethod: GET
          maxLines: 1000
          # Log → Trace correlation
          derivedFields:
            # Extract trace_id from logs and link to Tempo
            - datasourceUid: tempo
              matcherRegex: "trace_id[=:]\\s*(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
            # Extract request_id from logs for correlation
            - matcherRegex: "request_id[=:]\\s*(\\w+)"
              name: RequestID
              url: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Kagenti Dashboards'
        orgId: 1
        folder: 'Kagenti'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.4.0
        ports:
        - containerPort: 3000
          name: http
        env:
        # Admin credentials (for initial setup)
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin123"

        # Disable anonymous auth
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"

        # Server settings
        - name: GF_SERVER_ROOT_URL
          value: "https://grafana.localtest.me:9443"

        # Generic OAuth / OIDC configuration (Keycloak)
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: "Keycloak"
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: "grafana"
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-client-secret
              key: CLIENT_SECRET
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: "openid profile email"
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: "https://keycloak.localtest.me:9443/realms/kubernetes/protocol/openid-connect/auth"
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: "http://keycloak.keycloak.svc:8080/realms/kubernetes/protocol/openid-connect/token"
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: "http://keycloak.keycloak.svc:8080/realms/kubernetes/protocol/openid-connect/userinfo"
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'"
        - name: GF_AUTH_SIGNOUT_REDIRECT_URL
          value: "https://keycloak.localtest.me:9443/realms/kubernetes/protocol/openid-connect/logout?redirect_uri=https%3A%2F%2Fgrafana.localtest.me%3A9443"

        # Unified Alerting configuration
        - name: GF_UNIFIED_ALERTING_ENABLED
          value: "true"
        - name: GF_ALERTING_ENABLED
          value: "false"  # Disable legacy alerting
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboards-config
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards
          mountPath: /etc/grafana/dashboards
        - name: grafana-alerting
          mountPath: /etc/grafana/provisioning/alerting
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: grafana-storage
        emptyDir: {}
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboards-config
        configMap:
          name: grafana-dashboards-config
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
      - name: grafana-alerting
        configMap:
          name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: grafana
