# HTTPRoute for Jaeger UI
# Exposes Jaeger query interface via Gateway API with HTTPS enforcement

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
    app.kubernetes.io/name: jaeger
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: https  # Use HTTPS listener

  hostnames:
  - "jaeger.localtest.me"

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: jaeger-query
      port: 16686

---
# HTTP to HTTPS redirect for Jaeger
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger-http-redirect
  namespace: observability
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: http-redirect
  hostnames:
  - "jaeger.localtest.me"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
