# Jaeger All-in-One Deployment
# Single deployment with collector, query, and UI
# For production, consider Jaeger Operator or separate components

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
        sidecar.istio.io/inject: "false"  # Don't inject Istio sidecar into tracing backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "14269"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:1.54
        imagePullPolicy: IfNotPresent
        env:
        # Collector configuration
        - name: COLLECTOR_OTLP_ENABLED
          value: "true"
        - name: COLLECTOR_ZIPKIN_HOST_PORT
          value: ":9411"

        # Storage configuration (in-memory for dev, change for production)
        - name: SPAN_STORAGE_TYPE
          value: "memory"
        - name: MEMORY_MAX_TRACES
          value: "50000"  # Keep last 50k traces in memory

        # Query configuration
        - name: QUERY_BASE_PATH
          value: "/"

        # UI configuration
        - name: JAEGER_DISABLED
          value: "false"

        # Sampling configuration
        - name: SAMPLING_STRATEGIES_FILE
          value: "/etc/jaeger/sampling.json"

        ports:
        # Collector ports
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        - name: zipkin
          containerPort: 9411
          protocol: TCP
        - name: jaeger-grpc
          containerPort: 14250
          protocol: TCP
        - name: jaeger-thrift
          containerPort: 14268
          protocol: TCP

        # Query/UI port
        - name: ui
          containerPort: 16686
          protocol: TCP

        # Admin/Health/Metrics port (Jaeger uses single port for admin, health, and metrics)
        - name: admin
          containerPort: 14269
          protocol: TCP

        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

        livenessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: 14269
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        volumeMounts:
        - name: sampling-config
          mountPath: /etc/jaeger
          readOnly: true

      volumes:
      - name: sampling-config
        configMap:
          name: jaeger-sampling-config
---
# Sampling Configuration
# Controls which traces are collected
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-sampling-config
  namespace: observability
data:
  sampling.json: |
    {
      "service_strategies": [
        {
          "service": "istio-ingressgateway",
          "type": "probabilistic",
          "param": 0.5
        },
        {
          "service": "redis",
          "type": "probabilistic",
          "param": 1.0
        },
        {
          "service": "postgres",
          "type": "probabilistic",
          "param": 1.0
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1
      }
    }
