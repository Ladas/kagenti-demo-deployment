# Jaeger Infrastructure Tracing Component
# Distributed tracing for infrastructure and service mesh
#
# Purpose: Infrastructure-level traces (Istio, Redis, PostgreSQL, HTTP requests)
# Companion to Phoenix (application/agent traces)
#
# Deployment: Jaeger All-in-One (for dev/staging) or Operator (for production)
# Ref: https://www.jaegertracing.io/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml

labels:
  - pairs:
      app.kubernetes.io/name: jaeger
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: observability
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  config.kubernetes.io/origin: |
    path: components/observability/jaeger/kustomization.yaml
  description: |
    Infrastructure-level distributed tracing.
    Handles: Istio service mesh, Redis, PostgreSQL, HTTP requests.
    Phoenix handles: Agent/LLM traces (OpenInference instrumentation).
