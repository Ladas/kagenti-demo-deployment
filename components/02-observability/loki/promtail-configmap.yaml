# Promtail Configuration
# Collects logs from Kubernetes pods and sends to Loki

apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: observability
  labels:
    app: promtail
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: logging
data:
  promtail.yaml: |
    # Promtail server configuration
    server:
      http_listen_port: 3101
      grpc_listen_port: 0
      log_level: info

    # Position tracking (where Promtail left off reading logs)
    positions:
      filename: /tmp/positions.yaml

    # Loki client configuration
    clients:
      - url: http://loki-query-frontend.observability.svc:3100/loki/api/v1/push
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10
        timeout: 10s

    # Scrape configuration
    scrape_configs:
      # Scrape all Kubernetes pod logs
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod

        pipeline_stages:
          # Extract JSON fields from logs (if JSON formatted)
          - cri: {}

          # Extract trace_id, span_id, request_id from JSON logs
          - json:
              expressions:
                trace_id: trace_id
                span_id: span_id
                request_id: request_id
                level: level
                user_id: user.id
                tenant_id: tenant.id

          # Add low-cardinality fields as labels
          - labels:
              level:

        relabel_configs:
          # Only collect logs from pods (skip host logs)
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: __host__

          # Add namespace label
          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: namespace

          # Add pod name label
          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: pod

          # Add container name label
          - source_labels:
              - __meta_kubernetes_pod_container_name
            action: replace
            target_label: container

          # Add app label (from pod labels)
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: replace
            target_label: app

          # Add job label (from pod labels)
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            action: replace
            target_label: job

          # Add node name label
          - source_labels:
              - __meta_kubernetes_pod_node_name
            action: replace
            target_label: node

          # Drop logs from Promtail itself (avoid log loop)
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: drop
            regex: promtail

          # Drop logs from Loki itself (avoid log loop)
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: drop
            regex: loki

          # Set log path to container logs
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
