# Grafana Alloy Service
# Exposes OTLP receivers for applications to send telemetry data

apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability
  labels:
    app: alloy
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: telemetry
spec:
  type: ClusterIP
  selector:
    app: alloy
  ports:
    # Alloy HTTP server (metrics, health checks)
    - name: http-metrics
      port: 12345
      targetPort: 12345
      protocol: TCP

    # OTLP gRPC receiver
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP

    # OTLP HTTP receiver
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
