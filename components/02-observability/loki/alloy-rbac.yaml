# Grafana Alloy RBAC
# Permissions for Alloy to discover and collect logs from Kubernetes pods

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: observability
  labels:
    app: alloy
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: telemetry

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
  labels:
    app: alloy
    app.kubernetes.io/name: alloy
rules:
  # Read pods, services, endpoints for discovery
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - namespaces
      - nodes
    verbs: ["get", "list", "watch"]

  # Read pod logs via Kubernetes API
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
  labels:
    app: alloy
    app.kubernetes.io/name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
