# NetworkPolicies for Observability Stack
# Defense-in-depth network security for tracing and monitoring

---
# Tempo - Infrastructure Tracing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo
  namespace: observability
  labels:
    app: tempo
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from OTEL Collector (trace ingestion)
  - from:
    - podSelector:
        matchLabels:
          app: otel-collector
    ports:
    - protocol: TCP
      port: 4317  # OTLP gRPC
    - protocol: TCP
      port: 4318  # OTLP HTTP

  # Allow from Prometheus (metrics scraping)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
      podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 3200  # Metrics

  # Allow from OAuth2 Proxy (authenticated UI access)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: oauth2-proxy
    ports:
    - protocol: TCP
      port: 3200  # UI

  # Allow from Grafana (same namespace, datasource queries)
  - from:
    - podSelector:
        matchLabels:
          app: grafana
    ports:
    - protocol: TCP
      port: 3200  # Query API

  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53

  # Allow to Istio control plane (required for sidecar injection)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
      podSelector:
        matchLabels:
          app: istiod
    ports:
    - protocol: TCP
      port: 15012  # xDS API
    - protocol: TCP
      port: 15010  # xDS and CA discovery

