# Tempo Infrastructure Tracing Component
# Distributed tracing backend from Grafana Labs
#
# Purpose: Infrastructure-level traces (Istio, Redis, PostgreSQL, HTTP requests)
# Companion to Phoenix (application/agent traces)
#
# Advantages over Jaeger:
# - Better storage efficiency (Parquet format)
# - Native Grafana integration
# - Cost-effective object storage support
# - TraceQL query language
#
# Deployment: Tempo monolithic mode (for dev/staging)
# Ref: https://grafana.com/docs/tempo/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  # Tempo is accessed via Grafana Explore - no dedicated UI endpoint needed
  # Grafana connects directly to Tempo API (tempo.observability.svc:3200)

labels:
  - pairs:
      app.kubernetes.io/name: tempo
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: observability
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  config.kubernetes.io/origin: |
    path: components/observability/tempo/kustomization.yaml
  description: |
    Infrastructure-level distributed tracing with Tempo.
    Handles: Istio service mesh, Redis, PostgreSQL, HTTP requests.
    Phoenix handles: Agent/LLM traces (OpenInference instrumentation).
