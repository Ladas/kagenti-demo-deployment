# Tempo Configuration
# Monolithic mode deployment for dev/staging

apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
  labels:
    app: tempo
data:
  tempo.yaml: |
    # Server configuration
    server:
      http_listen_port: 3200
      grpc_listen_port: 9096
      log_level: info

    # Distributor configuration (receives traces)
    distributor:
      receivers:
        # OTLP receivers (primary ingestion path)
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

        # Jaeger receivers (for compatibility)
        jaeger:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14250
            thrift_http:
              endpoint: 0.0.0.0:14268

        # Zipkin receiver (for compatibility)
        zipkin:
          endpoint: 0.0.0.0:9411

    # Ingester configuration (writes traces to storage)
    ingester:
      max_block_duration: 5m
      trace_idle_period: 30s
      max_block_bytes: 1048576
      flush_check_period: 10s

    # Compactor configuration (merges blocks)
    compactor:
      compaction:
        block_retention: 48h  # Keep traces for 2 days (dev mode)
      ring:
        kvstore:
          store: inmemory

    # Storage configuration
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
        pool:
          max_workers: 100
          queue_depth: 10000

    # Query frontend configuration
    query_frontend:
      search:
        max_duration: 0s  # Disable duration limit
