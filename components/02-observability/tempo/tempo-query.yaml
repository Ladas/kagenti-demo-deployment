# Tempo Query - Jaeger UI for Tempo
# Provides web interface for querying traces stored in Tempo
#
# Tempo Query wraps Tempo with Jaeger Query UI, enabling:
# - Visual trace exploration
# - Search and filter capabilities
# - Service dependency graphs
# - Compatible with Jaeger UI workflows
#
# Architecture:
#   Browser → OAuth2-Proxy → Tempo Query (Jaeger UI) → Tempo (gRPC API)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-query
  namespace: observability
  labels:
    app: tempo-query
    app.kubernetes.io/name: tempo-query
    app.kubernetes.io/component: tracing-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo-query
  template:
    metadata:
      labels:
        app: tempo-query
        app.kubernetes.io/name: tempo-query
    spec:
      containers:
      - name: tempo-query
        image: grafana/tempo-query:2.6.1
        imagePullPolicy: IfNotPresent
        args:
          - --grpc-storage-plugin.configuration-file=/etc/tempo-query/tempo-query.yaml
        ports:
        # Jaeger UI
        - name: jaeger-ui
          containerPort: 16686
          protocol: TCP
        # gRPC query
        - name: grpc
          containerPort: 16685
          protocol: TCP

        env:
        # Required environment variables for Jaeger Query
        - name: BACKEND
          value: "tempo:9096"
        - name: TENANT_HEADER_KEY
          value: "x-scope-orgid"

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5

        readinessProbe:
          httpGet:
            path: /
            port: 16686
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5

        volumeMounts:
        - name: config
          mountPath: /etc/tempo-query
          readOnly: true

      volumes:
      - name: config
        configMap:
          name: tempo-query-config

---
apiVersion: v1
kind: Service
metadata:
  name: tempo-query
  namespace: observability
  labels:
    app: tempo-query
    app.kubernetes.io/name: tempo-query
spec:
  type: ClusterIP
  ports:
  # Jaeger UI HTTP port
  - name: jaeger-ui
    port: 16686
    targetPort: 16686
    protocol: TCP
  # gRPC query port
  - name: grpc
    port: 16685
    targetPort: 16685
    protocol: TCP
  selector:
    app: tempo-query

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-query-config
  namespace: observability
  labels:
    app: tempo-query
    app.kubernetes.io/name: tempo-query
data:
  tempo-query.yaml: |
    backend: "tempo:9096"
