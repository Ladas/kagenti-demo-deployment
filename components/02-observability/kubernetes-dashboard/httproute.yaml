apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: https  # Use HTTPS listener
  hostnames:
  - "kubernetes-dashboard.localtest.me"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kubernetes-dashboard
      port: 443

---
# HTTP to HTTPS redirect for Kubernetes Dashboard
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-dashboard-http-redirect
  namespace: kubernetes-dashboard
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: http-redirect
  hostnames:
  - "kubernetes-dashboard.localtest.me"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
