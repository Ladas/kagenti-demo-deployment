apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflector
  namespace: reflector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reflector
  template:
    metadata:
      labels:
        app: reflector
    spec:
      serviceAccountName: reflector
      containers:
      - name: reflector
        image: emberstack/kubernetes-reflector:7.1.262
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        env:
        - name: ES_Serilog__MinimumLevel__Default
          value: "Information"
