apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-inspector
  namespace: kagenti-system
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
  hostnames:
  - mcp-inspector.localtest.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: mcp-inspector
      port: 6274
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-proxy
  namespace: kagenti-system
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
  hostnames:
  - mcp-proxy.localtest.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: mcp-inspector
      port: 6277
