# Placeholder GitHub token secret for dev environment
# Required by kagenti UI for agent builds
# For public repos with local registry, token is not actually used for authentication
# In production, replace with actual GitHub credentials for private repos

apiVersion: v1
kind: Secret
metadata:
  name: github-token-secret
  namespace: default
  labels:
    app.kubernetes.io/name: github-token-secret
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: infrastructure
type: Opaque
stringData:
  user: "demo"
  token: ""  # Empty for public repos in dev
