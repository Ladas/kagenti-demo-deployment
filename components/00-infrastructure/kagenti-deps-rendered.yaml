# Source: kagenti-deps/templates/keycloak-k8s.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    helm.sh/chart: kagenti-deps-0.1.0
    app.kubernetes.io/name: kagenti-deps
    app.kubernetes.io/instance: kagenti-deps
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
