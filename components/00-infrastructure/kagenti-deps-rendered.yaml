# Source: kagenti-deps/templates/kiali-k8s.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiali
  namespace: kiali-system
data:
  config.yaml: |
    auth:
      strategy: anonymous
    deployment:
      accessible_namespaces:
      - "**"
      namespace: kiali-system
    external_services:
      custom_dashboards:
        enabled: true
      grafana:
        enabled: true
        in_cluster_url: http://grafana.observability:3000
        url: http://grafana.localtest.me:8080
      istio:
        config_map_name: istio
        istio_sidecar_injector_config_map_name: istio-sidecar-injector
        istiod_deployment_name: istiod
        root_namespace: istio-system
      prometheus:
        url: http://prometheus-server.observability:80
      tracing:
        enabled: false
    server:
      web_root: /
      port: 20001
---
# Source: kagenti-deps/templates/otel-collector.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  base.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318 # overriden by the server

    exporters:
      debug:
        verbosity: detailed
      otlp/phoenix:
        endpoint: phoenix:4317
        tls:
          insecure: true

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 1000
      batch:
      filter/phoenix:
        traces:
          span:
            ## Filter for openinference packages
            #### Python format `openinference.instrumentation.${package_name}`
            #### - crewAI exception `crewai.telemetry`
            #### Javascript format `@arizeai/openinference-instrumentation-${packageName}`
            - not(IsMatch(instrumentation_scope.name, "^openinference\\.instrumentation\\..*") or IsMatch(instrumentation_scope.name, "^@arizeai/openinference-instrumentation-.*") or instrumentation_scope.name == "crewai.telemetry")

    extensions:
      health_check:

    service:
      extensions: [ health_check ]
      pipelines:
        traces/phoenix:
          receivers: [ otlp ]
          processors: [ memory_limiter, filter/phoenix, batch ]
          exporters: [ otlp/phoenix ]
---
# Source: kagenti-deps/templates/phoenix-postgres.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-otel-init-script
data:
  # these scripts are required for quay.io/fedora/postgresql-15
  set_passwords.sh: |
    #!/bin/bash

    _psql () { psql --set ON_ERROR_STOP=1 "$@" ; }

    if [[ ",$postinitdb_actions," = *,simple_db,* ]]; then
    _psql --set=username="$POSTGRESQL_USER" \
          --set=password="$POSTGRESQL_PASSWORD" \
    <<< "ALTER USER :\"username\" WITH ENCRYPTED PASSWORD :'password';"
    fi

    if [ -v POSTGRESQL_MASTER_USER ]; then
    _psql --set=masteruser="$POSTGRESQL_MASTER_USER" \
          --set=masterpass="$POSTGRESQL_MASTER_PASSWORD" \
    <<'EOF'
    ALTER USER :"masteruser" WITH REPLICATION;
    ALTER USER :"masteruser" WITH ENCRYPTED PASSWORD :'masterpass';
    EOF
    fi

    if [ -v POSTGRESQL_ADMIN_PASSWORD ]; then
    _psql --set=adminpass="$POSTGRESQL_ADMIN_PASSWORD" \
    <<<"ALTER USER \"postgres\" WITH ENCRYPTED PASSWORD :'adminpass';"
    fi
  init.sh: |
    #!/bin/bash
    set -e
    
    psql -v ON_ERROR_STOP=1  <<-EOSQL
        ALTER DATABASE postgres OWNER TO testuser;
    EOSQL
