apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kagenti-deps-mcp-config-binding
  annotations:
    "helm.sh/hook": post-install, post-upgrade
    "helm.sh/hook-weight": "-4" # Runs after the SA and Role are created
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kagenti-deps-mcp-config-role
subjects:
  - kind: ServiceAccount
    name: kagenti-deps-mcp-config-sa
    namespace: default
---
# Source: kagenti-deps/templates/mcp-inspector-config.yaml
# ——————————————————————————————————————————————————————————————————————————————
#  Configuration Job (Post-Install Hook)
#  This job waits for routes/ingresses and creates the mcp-inspector-config ConfigMap.
# ——————————————————————————————————————————————————————————————————————————————
apiVersion: batch/v1
kind: Job
metadata:
  name: kagenti-deps-mcp-config-job
  namespace: default
  annotations:
    "helm.sh/hook": post-install, post-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded
  labels:
    helm.sh/chart: kagenti-deps-0.1.0
    app.kubernetes.io/name: kagenti-deps
    app.kubernetes.io/instance: kagenti-deps
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: kagenti-deps-mcp-config-sa
      restartPolicy: OnFailure
      containers:
        - name: route-checker-and-config-creator
          image: "quay.io/kubestellar/kubectl:1.30.14"
          command:
            - "/bin/sh"
            - "-c"
            - |
              set -e
              echo "Starting MCP config job..."
              # Get hostname from the HTTPRoute hostnames
              INSPECTOR_HOST=$(kubectl get httproute mcp-inspector -n kagenti-system -o jsonpath='{.spec.hostnames[0]}')

              # If no hostname in HTTPRoute, construct from domain
              if [ -z "$INSPECTOR_HOST" ]; then
                INSPECTOR_HOST="mcp-inspector.localhost"
              fi

              if [ -z "$INSPECTOR_HOST" ]; then
                echo "Error: Could not retrieve hostname."
                exit 1
              fi

              echo "Inspector host: $INSPECTOR_HOST"

              # Create the ConfigMap using a heredoc and apply it
              echo "Creating/updating mcp-inspector-config ConfigMap..."
              kubectl apply -n default -f - <<EOF
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: mcp-inspector-config
              data:
                ALLOWED_ORIGINS: "https://${INSPECTOR_HOST}"
              EOF

              echo "ConfigMap 'mcp-inspector-config' applied successfully."
