# Kind-specific overrides for kagenti-deps
# Disable OpenShift-specific features

openshift: false

components:
  mcpInspector:
    enabled: true
  istio:
    enabled: false  # Already installed
  kiali:
    enabled: true
  keycloak:
    enabled: true  # Fixed YAML template syntax error
  metricsServer:
    enabled: false
  otel:
    enabled: true
  containerRegistry:
    enabled: true  # Enable internal registry
  spire:
    enabled: false  # Skip for now
  tekton:
    enabled: false  # Already installed
  certManager:
    enabled: false  # Already installed
  gatewayApi:
    enabled: false  # Already installed
  ingressGateway:
    enabled: false
  toolhive:
    enabled: false  # Skip for now

keycloak:
  namespace: keycloak
  auth:
    adminUser: admin
    adminPassword: admin123
  httpRoute:
    annotations: {}
    parentRefs:
      - name: external-gateway
        namespace: default
    hostnames:
      - "keycloak.localtest.me"
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

kiali:
  httpRoute:
    parentRefs:
      - name: external-gateway
        namespace: default
    hostnames:
      - "kiali.localtest.me"
