# Database Secret Generation Job
# Generates random database credentials for PostgreSQL and Keycloak
# Production-like approach: No hardcoded secrets
#
# RBAC resources (ServiceAccount, Role, RoleBinding) are in db-secret-generator-rbac.yaml
# They deploy at sync-wave -2 (before this job at wave -1)

---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-secret-generator
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: db-secret-generator
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: db-secret-generator
      restartPolicy: OnFailure
      containers:
        - name: secret-generator
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "=== Database Secret Generator ==="
              echo "Namespace: keycloak"
              echo "Secret name: keycloak-db-secret"
              echo ""

              # Generate random credentials (production-grade)
              DB_USERNAME="keycloak"
              DB_PASSWORD=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)

              # Check if secret already exists
              if kubectl get secret keycloak-db-secret -n keycloak >/dev/null 2>&1; then
                echo "✓ Secret 'keycloak-db-secret' already exists"
                echo "  Skipping creation to preserve existing credentials"
                exit 0
              fi

              echo "Creating new secret 'keycloak-db-secret'..."

              # Create secret
              kubectl create secret generic keycloak-db-secret \
                --namespace=keycloak \
                --from-literal=username="$DB_USERNAME" \
                --from-literal=password="$DB_PASSWORD"

              echo "✓ Secret created successfully"
              echo "  Username: $DB_USERNAME"
              echo "  Password: <hidden 32-character random string>"
