# OAuth2 Client Secrets Extraction Job
# Queries Keycloak for OAuth2 client secrets and creates Kubernetes secrets
# Runs as PostSync hook after realm-import-job (sync-wave: 2)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-secrets-extractor
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: authentication
  annotations:
    argocd.argoproj.io/sync-wave: "1"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: oauth2-secrets-extractor
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: authentication
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: oauth2-secrets-extractor
      annotations:
        sidecar.istio.io/inject: "true"  # Enable Istio sidecar for mTLS to Keycloak
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'  # Fix sidecar race condition
    spec:
      serviceAccountName: oauth2-secrets-extractor
      restartPolicy: OnFailure
      containers:
        - name: secrets-extractor
          image: bitnami/kubectl:latest
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              set -e
              echo "=== OAuth2 Client Secrets Extraction ==="

              # Get admin credentials
              ADMIN_USER=$(cat /etc/keycloak-admin/username)
              ADMIN_PASS=$(cat /etc/keycloak-admin/password)
              KEYCLOAK_URL="http://keycloak.keycloak.svc.cluster.local:8080"

              # Wait for Keycloak token endpoint
              echo "Getting admin access token..."
              MAX_RETRIES=30
              RETRY_COUNT=0
              TOKEN=""

              while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ -z "$TOKEN" ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Attempt $RETRY_COUNT/$MAX_RETRIES..."

                TOKEN=$(curl -sf -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "username=${ADMIN_USER}" \
                  -d "password=${ADMIN_PASS}" \
                  -d "grant_type=password" \
                  -d "client_id=admin-cli" 2>/dev/null | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)

                if [ -n "$TOKEN" ]; then
                  echo "✓ Access token obtained"
                  break
                fi

                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  sleep 5
                fi
              done

              if [ -z "$TOKEN" ]; then
                echo "ERROR: Failed to get access token"
                exit 1
              fi

              # Function to get client secret
              get_client_secret() {
                local realm=$1
                local client_id=$2

                echo "Getting secret for client: $client_id in realm: $realm" >&2

                # Get client UUID
                CLIENT_UUID=$(curl -sf -H "Authorization: Bearer $TOKEN" \
                  "${KEYCLOAK_URL}/admin/realms/${realm}/clients?clientId=${client_id}" \
                  | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)

                if [ -z "$CLIENT_UUID" ]; then
                  echo "WARNING: Client $client_id not found in realm $realm" >&2
                  return 1
                fi

                # Get client secret
                CLIENT_SECRET=$(curl -sf -H "Authorization: Bearer $TOKEN" \
                  "${KEYCLOAK_URL}/admin/realms/${realm}/clients/${CLIENT_UUID}/client-secret" \
                  | grep -o '"value":"[^"]*' | cut -d'"' -f4)

                if [ -z "$CLIENT_SECRET" ]; then
                  echo "WARNING: No secret found for client $client_id" >&2
                  return 1
                fi

                echo "$CLIENT_SECRET"
              }

              # Extract secrets for kubernetes realm clients
              echo ""
              echo "=== Extracting kubernetes realm client secrets ==="

              GRAFANA_SECRET=$(get_client_secret "kubernetes" "grafana")
              KIALI_SECRET=$(get_client_secret "kubernetes" "kiali")
              PROMETHEUS_SECRET=$(get_client_secret "kubernetes" "prometheus")
              TEMPO_SECRET=$(get_client_secret "kubernetes" "tempo")

              # Extract secrets for kagenti realm clients
              echo ""
              echo "=== Extracting kagenti realm client secrets ==="

              PHOENIX_SECRET=$(get_client_secret "kagenti" "phoenix")
              KAGENTI_UI_SECRET=$(get_client_secret "kagenti" "kagenti-ui")

              # Generate cookie secret (random 32-byte base64)
              COOKIE_SECRET=$(openssl rand -base64 32 | tr -d '\n')

              # Shutdown Istio sidecar before calling kubectl
              # (kubectl fails with "connection reset" when Istio proxy intercepts K8s API traffic)
              echo ""
              echo "Shutting down Istio sidecar before kubectl operations..."
              curl -sf -X POST http://localhost:15020/quitquitquit || true
              echo "✓ Istio sidecar shutdown requested"
              sleep 2  # Wait for sidecar to terminate

              echo ""
              echo "=== Creating Kubernetes secrets in oauth2-proxy namespace ==="

              # Create individual client secrets
              for client in grafana kiali prometheus tempo phoenix; do
                secret_var="${client^^}_SECRET"
                secret_value=$(eval echo \$$secret_var)

                if [ -n "$secret_value" ]; then
                  echo "Creating secret: keycloak-${client}-client-secret"
                  kubectl create secret generic "keycloak-${client}-client-secret" \
                    -n oauth2-proxy \
                    --from-literal=client-id="$client" \
                    --from-literal=client-secret="$secret_value" \
                    --dry-run=client -o yaml | kubectl apply --validate=false -f -
                  echo "✓ Secret created: keycloak-${client}-client-secret"
                else
                  echo "⚠ Skipping $client: no secret found"
                fi
              done

              # Create shared cookie secret
              echo "Creating shared cookie secret: oauth2-proxy-secrets"
              kubectl create secret generic oauth2-proxy-secrets \
                -n oauth2-proxy \
                --from-literal=cookie-secret="$COOKIE_SECRET" \
                --dry-run=client -o yaml | kubectl apply --validate=false -f -
              echo "✓ Secret created: oauth2-proxy-secrets"

              # Create kagenti-ui secret in kagenti-system namespace (if exists)
              if kubectl get namespace kagenti-system 2>/dev/null; then
                echo ""
                echo "=== Creating Kagenti UI OAuth secret in kagenti-system namespace ==="
                if [ -n "$KAGENTI_UI_SECRET" ]; then
                  kubectl create secret generic kagenti-ui-oauth-secret \
                    -n kagenti-system \
                    --from-literal=CLIENT_ID="kagenti-ui" \
                    --from-literal=CLIENT_SECRET="$KAGENTI_UI_SECRET" \
                    --from-literal=AUTH_ENDPOINT="https://keycloak.localtest.me:9443/realms/kagenti/protocol/openid-connect/auth" \
                    --from-literal=TOKEN_ENDPOINT="http://keycloak.keycloak.svc.cluster.local:8080/realms/kagenti/protocol/openid-connect/token" \
                    --from-literal=REDIRECT_URI="https://kagenti.localtest.me:9443/oauth2/callback" \
                    --from-literal=SCOPE="openid profile email" \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "✓ Secret created: kagenti-ui-oauth-secret"
                fi
              fi

              # Create grafana OIDC secret in observability namespace (if exists)
              if kubectl get namespace observability 2>/dev/null; then
                echo ""
                echo "=== Creating Grafana OIDC secret in observability namespace ==="
                if [ -n "$GRAFANA_SECRET" ]; then
                  kubectl create secret generic grafana-oidc-secret \
                    -n observability \
                    --from-literal=client-id="grafana" \
                    --from-literal=client-secret="$GRAFANA_SECRET" \
                    --dry-run=client -o yaml | kubectl apply --validate=false -f -
                  echo "✓ Secret created: grafana-oidc-secret"
                fi
              fi

              echo ""
              echo "=== OAuth2 secrets extraction completed successfully ==="

          volumeMounts:
            - name: keycloak-admin-credentials
              mountPath: /etc/keycloak-admin
              readOnly: true

      volumes:
        - name: keycloak-admin-credentials
          secret:
            secretName: keycloak-initial-admin
