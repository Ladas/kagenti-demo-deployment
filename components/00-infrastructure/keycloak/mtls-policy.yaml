# Strict mTLS for keycloak namespace (default policy)
# Ensures all service-to-service communication is encrypted
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: keycloak
spec:
  mtls:
    mode: STRICT

---
# Port-level mTLS policy for Keycloak
# Port 8080: STRICT mTLS for application traffic (OAuth2, API calls)
# Port 9000: DISABLE mTLS for health checks (kubelet doesn't have sidecar)
# This allows secure service-to-service communication while enabling health probes
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: keycloak-gateway-ingress
  namespace: keycloak
spec:
  selector:
    matchLabels:
      app: keycloak
  mtls:
    mode: STRICT  # Default: enforce mTLS on all ports
  portLevelMtls:
    "9000":
      mode: DISABLE  # Allow kubelet health checks without mTLS

---
# Disable mTLS for PostgreSQL service
# PostgreSQL does NOT have Istio sidecar (plain postgres container)
# Keycloak connects to Postgres via plain TCP (no TLS/SSL)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: postgres-mtls
  namespace: keycloak
spec:
  host: postgres.keycloak.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE

---
# Enable mTLS for Keycloak service
# Keycloak HAS Istio sidecar injected
# Pods with sidecars connect to Keycloak via mTLS
# Service name: 'keycloak' (vanilla StatefulSet deployment, not operator)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: keycloak-mtls
  namespace: keycloak
spec:
  host: keycloak.keycloak.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
