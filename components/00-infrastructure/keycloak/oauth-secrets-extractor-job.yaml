# Master OAuth Secrets Extractor Job
# Extracts ALL OAuth client secrets from Keycloak and creates them with Reflector annotations
# Reflector automatically mirrors secrets to target namespaces
#
# Services:
# - kagenti-ui (realm: kagenti) → kagenti-system namespace
# - grafana, kiali, tempo, phoenix, prometheus (realm: kubernetes) → oauth2-proxy namespace

apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-secrets-extractor-script
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  extract-secrets.sh: |
    #!/bin/sh
    set -e

    KEYCLOAK_URL="${KEYCLOAK_URL:-http://keycloak.keycloak.svc:8080}"
    ADMIN_USER="${KEYCLOAK_ADMIN:-admin}"
    ADMIN_PASSWORD="${KEYCLOAK_ADMIN_PASSWORD:-admin}"

    echo "=== Master OAuth Secrets Extractor ==="
    echo ""

    # Get admin token with retry logic
    echo "1. Getting admin token from Keycloak..."
    MAX_RETRIES=5
    RETRY_COUNT=0
    TOKEN=""

    while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
      TOKEN=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=${ADMIN_USER}" \
        -d "password=${ADMIN_PASSWORD}" \
        -d "grant_type=password" \
        -d "client_id=admin-cli" 2>&1 | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)

      if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
        echo "✓ Got admin token (attempt $((RETRY_COUNT + 1)))"
        break
      fi

      RETRY_COUNT=$((RETRY_COUNT + 1))
      if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
        echo "  Retry $RETRY_COUNT/$MAX_RETRIES - waiting 5 seconds..."
        sleep 5
      fi
    done

    if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
      echo "ERROR: Failed to get admin token after $MAX_RETRIES attempts"
      exit 1
    fi

    # Function to extract client secret from Keycloak
    extract_client_secret() {
      local REALM=$1
      local CLIENT_ID=$2

      echo "  Querying $REALM realm for $CLIENT_ID..." >&2

      # Get client UUID
      CLIENT_UUID=$(curl -s -X GET "${KEYCLOAK_URL}/admin/realms/${REALM}/clients?clientId=${CLIENT_ID}" \
        -H "Authorization: Bearer ${TOKEN}" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

      if [ -z "$CLIENT_UUID" ] || [ "$CLIENT_UUID" = "null" ]; then
        echo "  ✗ Client $CLIENT_ID not found in realm $REALM" >&2
        return 1
      fi

      echo "  ✓ Client UUID: $CLIENT_UUID" >&2

      # Get client secret
      CLIENT_SECRET=$(curl -s -X GET "${KEYCLOAK_URL}/admin/realms/${REALM}/clients/${CLIENT_UUID}/client-secret" \
        -H "Authorization: Bearer ${TOKEN}" | grep -o '"value":"[^"]*"' | cut -d'"' -f4)

      if [ -z "$CLIENT_SECRET" ] || [ "$CLIENT_SECRET" = "null" ]; then
        echo "  ✗ Client secret not found for $CLIENT_ID" >&2
        return 1
      fi

      echo "  ✓ Got secret: ${CLIENT_SECRET:0:8}...${CLIENT_SECRET: -8}" >&2
      echo "$CLIENT_SECRET"
    }

    # Function to create Kubernetes secret with Reflector annotations
    create_secret_with_reflection() {
      local SECRET_NAME=$1
      local CLIENT_ID=$2
      local CLIENT_SECRET=$3
      local REALM=$4
      local TARGET_NAMESPACE=$5
      local REDIRECT_URI=$6

      echo ""
      echo "  Creating secret: $SECRET_NAME → $TARGET_NAMESPACE"

      # Check if secret already exists and matches
      EXISTING_SECRET=$(kubectl get secret "$SECRET_NAME" -n keycloak -o jsonpath='{.data.CLIENT_SECRET}' 2>/dev/null | base64 -d || echo "")

      if [ -n "$EXISTING_SECRET" ] && [ "$EXISTING_SECRET" = "$CLIENT_SECRET" ]; then
        echo "  ✓ Secret already exists and matches Keycloak (no update needed)"
        return 0
      fi

      # Create secret with Reflector annotations
      kubectl create secret generic "$SECRET_NAME" \
        --from-literal=CLIENT_ID="${CLIENT_ID}" \
        --from-literal=CLIENT_SECRET="${CLIENT_SECRET}" \
        --from-literal=AUTH_ENDPOINT="https://keycloak.localtest.me:9443/realms/${REALM}/protocol/openid-connect/auth" \
        --from-literal=TOKEN_ENDPOINT="http://keycloak.keycloak.svc.cluster.local:8080/realms/${REALM}/protocol/openid-connect/token" \
        --from-literal=REDIRECT_URI="${REDIRECT_URI}" \
        --from-literal=SCOPE="openid profile email" \
        --namespace=keycloak \
        --dry-run=client -o yaml | \
      kubectl annotate --local=true -f - \
        reflector.v1.k8s.emberstack.com/reflection-allowed="true" \
        reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces="$TARGET_NAMESPACE" \
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled="true" \
        -o yaml | \
      kubectl apply --validate=false -f -

      # Verify secret was created correctly
      FINAL_SECRET=$(kubectl get secret "$SECRET_NAME" -n keycloak -o jsonpath='{.data.CLIENT_SECRET}' 2>/dev/null | base64 -d || echo "")

      if [ "$FINAL_SECRET" = "$CLIENT_SECRET" ]; then
        echo "  ✓ Secret created/updated successfully"
      else
        echo "  ✗ ERROR: Secret verification failed"
        return 1
      fi
    }

    echo ""
    echo "2. Extracting OAuth client secrets from Keycloak..."

    # Extract secrets from kagenti realm
    echo ""
    echo "=== Kagenti Realm ==="
    KAGENTI_UI_SECRET=$(extract_client_secret "kagenti" "kagenti-ui")
    PHOENIX_SECRET=$(extract_client_secret "kagenti" "phoenix")

    # Extract secrets from kubernetes realm
    echo ""
    echo "=== Kubernetes Realm ==="
    GRAFANA_SECRET=$(extract_client_secret "kubernetes" "grafana")
    KIALI_SECRET=$(extract_client_secret "kubernetes" "kiali")
    TEMPO_SECRET=$(extract_client_secret "kubernetes" "tempo")
    PROMETHEUS_SECRET=$(extract_client_secret "kubernetes" "prometheus")

    echo ""
    echo "3. Creating Kubernetes secrets with Reflector annotations..."

    # Create secrets with Reflector annotations
    create_secret_with_reflection "kagenti-ui-oauth-secret" "kagenti-ui" "$KAGENTI_UI_SECRET" "kagenti" "kagenti-system" "https://kagenti.localtest.me:9443/oauth2/callback"
    create_secret_with_reflection "phoenix-client-secret" "phoenix" "$PHOENIX_SECRET" "kagenti" "oauth2-proxy" "https://phoenix.localtest.me:9443/oauth2/callback"
    create_secret_with_reflection "grafana-client-secret" "grafana" "$GRAFANA_SECRET" "kubernetes" "observability,oauth2-proxy" "https://grafana.localtest.me:9443/oauth2/callback"
    create_secret_with_reflection "kiali-client-secret" "kiali" "$KIALI_SECRET" "kubernetes" "oauth2-proxy" "https://kiali.localtest.me:9443/oauth2/callback"
    create_secret_with_reflection "tempo-client-secret" "tempo" "$TEMPO_SECRET" "kubernetes" "oauth2-proxy" "https://tempo.localtest.me:9443/oauth2/callback"
    create_secret_with_reflection "prometheus-client-secret" "prometheus" "$PROMETHEUS_SECRET" "kubernetes" "oauth2-proxy" "https://prometheus.localtest.me:9443/oauth2/callback"

    echo ""
    echo "=== Secrets Extraction Complete ==="
    echo ""
    echo "✓ Secrets created in keycloak namespace with Reflector annotations"
    echo "✓ Reflector will automatically mirror these secrets to target namespaces:"
    echo "  - kagenti-ui-oauth-secret → kagenti-system"
    echo "  - grafana-client-secret → observability"
    echo "  - kiali-client-secret → observability"
    echo "  - tempo-client-secret → observability"
    echo "  - phoenix-client-secret → observability"
    echo "  - prometheus-client-secret → observability"
    echo ""
    echo "Check mirror status:"
    echo "  kubectl get secrets -n kagenti-system"
    echo "  kubectl get secrets -n observability"

    # Shutdown Istio sidecar to allow Job to complete
    echo ""
    echo "Shutting down Istio sidecar..."
    curl -sf -X POST http://localhost:15020/quitquitquit || true
    echo "✓ Istio sidecar shutdown requested"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: oauth2-secrets-extractor
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: oauth2-secrets-extractor
      annotations:
        # ENABLE Istio sidecar for mTLS to Keycloak
        sidecar.istio.io/inject: "true"
        # Exclude K8s API server from Istio sidecar interception
        # kubectl traffic bypasses sidecar, Keycloak traffic uses sidecar + mTLS
        traffic.sidecar.istio.io/excludeOutboundIPRanges: "10.96.0.1/32"
    spec:
      serviceAccountName: oauth2-secrets-extractor
      restartPolicy: OnFailure
      initContainers:
      # Wait for Keycloak to be ready
      - name: wait-for-keycloak
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Keycloak pod to be ready..."
          until kubectl wait --for=condition=Ready pod -l app=keycloak -n keycloak --timeout=10s 2>/dev/null; do
            echo "Keycloak pod not ready yet, waiting..."
            sleep 5
          done
          echo "Keycloak pod is ready!"
      containers:
      - name: extract
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "/scripts/extract-secrets.sh"]
        env:
        - name: KEYCLOAK_URL
          value: "http://keycloak.keycloak.svc:8080"
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-initial-admin
              key: username
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-initial-admin
              key: password
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: oauth-secrets-extractor-script
          defaultMode: 0555
