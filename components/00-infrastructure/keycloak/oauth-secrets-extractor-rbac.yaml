# RBAC for OAuth Secrets Extractor Job
# Allows Job to create secrets in keycloak namespace with Reflector annotations

apiVersion: v1
kind: ServiceAccount
metadata:
  name: oauth2-secrets-extractor
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth2-secrets-extractor
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth2-secrets-extractor
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oauth2-secrets-extractor
subjects:
- kind: ServiceAccount
  name: oauth2-secrets-extractor
  namespace: keycloak
---
# ClusterRole for querying Keycloak pods across namespaces
# Init container needs to check if Keycloak pod is Ready before main job runs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oauth2-secrets-extractor-pod-reader
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oauth2-secrets-extractor-pod-reader
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oauth2-secrets-extractor-pod-reader
subjects:
- kind: ServiceAccount
  name: oauth2-secrets-extractor
  namespace: keycloak
