# Keycloak Initial Admin Secret
# For dev/Kind environments only - uses static credentials
# For production: Use Sealed Secrets or External Secrets Operator
#
# NOTE: This secret is referenced by keycloak-statefulset.yaml for:
# - KC_BOOTSTRAP_ADMIN_USERNAME
# - KC_BOOTSTRAP_ADMIN_PASSWORD
#
# Sync wave: -2 (before Keycloak StatefulSet)
#
# Reflector: Automatically copies this secret to kagenti-system namespace
# - Replaces the manual copy-admin-secret-job.yaml (now deleted)
# - Auto-syncs when credentials change
# - No RBAC complexity, no Job lifecycle issues

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-initial-admin
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Reflector annotations for automatic cross-namespace secret copying
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "kagenti-system"
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: authentication
type: Opaque
stringData:
  username: admin
  password: admin123
