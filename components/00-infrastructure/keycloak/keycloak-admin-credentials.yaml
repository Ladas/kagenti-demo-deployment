# Keycloak Initial Admin Secret
# For dev/Kind environments only - uses static credentials
# For production: Use Sealed Secrets or External Secrets Operator
#
# NOTE: This secret is referenced by keycloak-statefulset.yaml for:
# - KC_BOOTSTRAP_ADMIN_USERNAME
# - KC_BOOTSTRAP_ADMIN_PASSWORD
#
# Sync wave: -2 (before Keycloak StatefulSet)

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-initial-admin
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: authentication
type: Opaque
stringData:
  username: admin
  password: admin123
