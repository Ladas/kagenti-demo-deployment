# Database Secret Generation Job RBAC Resources
# Must be deployed BEFORE the PreSync hook job runs
# Deployed at sync-wave -2 (before job at wave -1)

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-secret-generator
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-secret-generator
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-secret-generator
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-secret-generator
subjects:
  - kind: ServiceAccount
    name: db-secret-generator
    namespace: keycloak
