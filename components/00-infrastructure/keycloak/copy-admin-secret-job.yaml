# Copy Keycloak Admin Secret to Platform Namespaces
# Keycloak Operator creates keycloak-initial-admin secret in keycloak namespace
# Platform components (kagenti-ui, etc.) need this secret to call Keycloak Admin API
# Since Kubernetes doesn't allow cross-namespace secret mounts, we copy it
#
# RBAC for cross-namespace access is in: components/00-infrastructure/keycloak-platform-rbac/

---
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-keycloak-admin-secret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: keycloak-secret-copier
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: keycloak-secret-copier
      restartPolicy: OnFailure
      initContainers:
      # Wait for Keycloak Operator to create the keycloak-initial-admin secret
      - name: wait-for-secret
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for keycloak-initial-admin secret..."
          until kubectl get secret keycloak-initial-admin -n keycloak >/dev/null 2>&1; do
            echo "Secret not found yet, waiting..."
            sleep 5
          done
          echo "Secret found!"
      containers:
      - name: copy-secret
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - |
          set -e

          echo "=== Copy Keycloak Admin Secret to Platform Namespaces ==="
          echo ""

          # Get the secret from keycloak namespace
          echo "1. Reading keycloak-initial-admin secret from keycloak namespace..."
          USERNAME=$(kubectl get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.username}')
          PASSWORD=$(kubectl get secret keycloak-initial-admin -n keycloak -o jsonpath='{.data.password}')

          if [ -z "$USERNAME" ] || [ -z "$PASSWORD" ]; then
            echo "ERROR: Failed to read keycloak-initial-admin secret"
            exit 1
          fi
          echo "✓ Read credentials successfully"

          # Copy to kagenti-system namespace
          echo ""
          echo "2. Copying secret to kagenti-system namespace..."
          kubectl create secret generic keycloak-initial-admin \
            --namespace=kagenti-system \
            --from-literal=username="$(echo $USERNAME | base64 -d)" \
            --from-literal=password="$(echo $PASSWORD | base64 -d)" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✓ Secret copied to kagenti-system"
          echo ""
          echo "=== Copy Complete ==="
