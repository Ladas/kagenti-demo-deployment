apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Cert-Manager (deployed via separate Helm Application)
  # See: argocd/applications/helm/cert-manager.yaml

  # Gateway API CRDs
  - gateway-api/

  # Tekton Pipelines & Triggers
  - tekton/

  # Kagenti system namespace
  - kagenti-system-namespace.yaml

  # MCP Inspector (debugging tool)
  - mcp-inspector/

  # OAuth2 Proxy (authentication layer)
  - oauth2-proxy/

  # Istio strict mTLS policy (security hardening)
  - istio-config/

  # Keycloak (Operator-based, SPIFFE-enabled v26.4.1)
  - keycloak/

  # SPIRE (Workload Identity)
  - spire/

# NOTE: Istio base/istiod deployed via Helm (argocd/applications/helm/istio-*.yaml)
# NOTE: Container Registry deployed as separate Application (argocd/applications/base/container-registry.yaml)
# NOTE: Kiali deployed via Helm (argocd/applications/helm/kiali.yaml)
# NOTE: kagenti-deps-rendered.yaml REMOVED - all components now deployed as separate apps
