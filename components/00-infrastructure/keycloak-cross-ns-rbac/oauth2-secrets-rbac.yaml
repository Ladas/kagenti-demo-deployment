# OAuth2 Secrets Extractor - Cross-Namespace RBAC
# ServiceAccount in keycloak namespace needs permissions to create secrets in oauth2-proxy and observability namespaces
# This file is NOT subject to namespace transformation by kustomization.yaml
---
# ClusterRole to allow listing namespaces (needed for kubectl get namespace checks)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oauth2-secrets-extractor-namespace-reader
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oauth2-secrets-extractor-namespace-reader
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oauth2-secrets-extractor-namespace-reader
subjects:
  - kind: ServiceAccount
    name: oauth2-secrets-extractor
    namespace: keycloak

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth2-secrets-extractor
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth2-secrets-extractor
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oauth2-secrets-extractor
subjects:
  - kind: ServiceAccount
    name: oauth2-secrets-extractor
    namespace: keycloak

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth2-secrets-extractor
  namespace: observability
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth2-secrets-extractor
  namespace: observability
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oauth2-secrets-extractor
subjects:
  - kind: ServiceAccount
    name: oauth2-secrets-extractor
    namespace: keycloak

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth2-secrets-extractor
  namespace: kagenti-system
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth2-secrets-extractor
  namespace: kagenti-system
  labels:
    app.kubernetes.io/name: oauth2-secrets-extractor
    app.kubernetes.io/part-of: kagenti
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oauth2-secrets-extractor
subjects:
  - kind: ServiceAccount
    name: oauth2-secrets-extractor
    namespace: keycloak
