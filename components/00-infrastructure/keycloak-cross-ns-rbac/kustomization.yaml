# Cross-namespace RBAC for Keycloak OAuth2 Secrets Job
# Separate kustomization without namespace transformation
# ServiceAccount in keycloak namespace needs permissions in oauth2-proxy and observability namespaces

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NO namespace field - preserves explicit namespaces in resources

resources:
  - oauth2-secrets-rbac.yaml

labels:
  - pairs:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: authentication
    includeSelectors: false
