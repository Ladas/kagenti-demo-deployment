# HTTPRoutes for SPIRE Services
# Exposes SPIRE OIDC Discovery and Tornjak UI via Istio Gateway
# Ref: https://gateway-api.sigs.k8s.io/api-types/httproute/

---
# SPIFFE OIDC Discovery Provider
# Used by Keycloak for SPIFFE client authentication
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spire-oidc
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-oidc
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: identity
spec:
  parentRefs:
    - name: external-gateway
      namespace: istio-ingress
      sectionName: https
  # Hostname will be patched in overlays (spire-oidc.localtest.me or spire-oidc.apps.example.com)
  hostnames:
    - "spire-oidc.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: spire-spiffe-oidc-discovery-provider
          port: 8080
          weight: 1

---
# Tornjak Management UI
# Web interface for managing SPIRE identities
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spire-tornjak
  namespace: spire-system
  labels:
    app.kubernetes.io/name: spire-tornjak
    app.kubernetes.io/part-of: kagenti
    app.kubernetes.io/component: identity
spec:
  parentRefs:
    - name: external-gateway
      namespace: istio-ingress
      sectionName: https
  # Hostname will be patched in overlays
  hostnames:
    - "spire-tornjak.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: spire-tornjak-frontend
          port: 3000
          weight: 1
