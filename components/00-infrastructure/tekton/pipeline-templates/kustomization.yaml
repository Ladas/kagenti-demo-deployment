# Tekton Pipeline Templates for Component Builds
# ConfigMaps used by kagenti-operator for custom build pipelines

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kagenti-system

resources:
  - pipeline-template-dev-local.yaml
  - pipeline-template-dev-external.yaml

labels:
  - pairs:
      app.kubernetes.io/name: tekton-pipeline-templates
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: infrastructure
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  config.kubernetes.io/origin: |
    path: components/infrastructure/tekton/pipeline-templates/kustomization.yaml
