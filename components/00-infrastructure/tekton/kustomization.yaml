# Tekton Pipelines Infrastructure Component
# CI/CD pipeline infrastructure for building agent images
#
# Official Tekton Pipelines installation
# Ref: https://tekton.dev/docs/installation/pipelines/

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace set - Tekton release.yaml creates its own namespaces
resources:
  # Tekton Pipelines - latest stable release (includes namespace)
  - https://storage.googleapis.com/tekton-releases/pipeline/latest/release.yaml
  # Pipeline templates for kagenti-operator Component builds
  - pipeline-templates
  # Pipeline step definitions (Tekton tasks)
  - steps

labels:
  - pairs:
      app.kubernetes.io/name: tekton-pipelines
      app.kubernetes.io/part-of: kagenti
      app.kubernetes.io/component: infrastructure
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  config.kubernetes.io/origin: |
    path: components/infrastructure/tekton/kustomization.yaml
