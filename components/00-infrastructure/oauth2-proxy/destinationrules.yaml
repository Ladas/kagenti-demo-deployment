# DestinationRules for OAuth2-Proxy services
# Since OAuth2-Proxy pods have no Istio sidecars, clients (like Gateway) must use plain HTTP (not mTLS)

---
# Phoenix OAuth2-Proxy
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: phoenix-oauth2-proxy-disable-mtls
  namespace: oauth2-proxy
spec:
  host: phoenix-oauth2-proxy.oauth2-proxy.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE  # Gateway must use plain HTTP, OAuth2-Proxy has no sidecar

---
# Prometheus OAuth2-Proxy
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: prometheus-oauth2-proxy-disable-mtls
  namespace: oauth2-proxy
spec:
  host: prometheus-oauth2-proxy.oauth2-proxy.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE  # Gateway must use plain HTTP, OAuth2-Proxy has no sidecar

---
# Kiali OAuth2-Proxy
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: kiali-oauth2-proxy-disable-mtls
  namespace: oauth2-proxy
spec:
  host: kiali-oauth2-proxy.oauth2-proxy.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE  # Gateway must use plain HTTP, OAuth2-Proxy has no sidecar
