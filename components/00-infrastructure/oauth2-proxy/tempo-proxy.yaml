# OAuth2 Proxy for Tempo
# Protects Tempo UI with Keycloak authentication (kubernetes realm)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo-oauth2-proxy
  namespace: oauth2-proxy
  labels:
    app: tempo-oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tempo-oauth2-proxy
  template:
    metadata:
      labels:
        app: tempo-oauth2-proxy
    spec:
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
        args:
          # OIDC Provider (Keycloak)
          - --provider=oidc
          - --oidc-issuer-url=http://keycloak.keycloak.svc:8080/realms/kubernetes
          - --skip-oidc-discovery=true
          - --client-id=tempo
          - --client-secret=$(CLIENT_SECRET)
          - --redirect-url=https://tempo.localtest.me:9443/oauth2/callback
          - --insecure-oidc-skip-issuer-verification=true
          - --login-url=https://keycloak.localtest.me:9443/realms/kubernetes/protocol/openid-connect/auth
          - --redeem-url=http://keycloak.keycloak.svc:8080/realms/kubernetes/protocol/openid-connect/token
          - --oidc-jwks-url=http://keycloak.keycloak.svc:8080/realms/kubernetes/protocol/openid-connect/certs

          # Upstream (Tempo Query - Jaeger UI)
          - --upstream=http://tempo-query.observability.svc:16686

          # Cookie settings
          - --cookie-name=_oauth2_proxy_tempo
          - --cookie-secret=$(COOKIE_SECRET)
          - --cookie-secure=true
          - --cookie-httponly=true
          - --cookie-samesite=lax

          # Email/user settings
          - --email-domain=*
          - --skip-provider-button=true
          - --insecure-oidc-allow-unverified-email=true

          # HTTP settings
          - --http-address=0.0.0.0:4180
          - --reverse-proxy=true

          # Security
          - --pass-access-token=true
          - --pass-authorization-header=true
          - --set-authorization-header=true
          - --set-xauthrequest=true

        env:
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: tempo-client-secret
              key: CLIENT_SECRET
        - name: COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secrets
              key: cookie-secret

        ports:
        - containerPort: 4180
          name: http

        livenessProbe:
          httpGet:
            path: /ping
            port: 4180
          initialDelaySeconds: 10

        readinessProbe:
          httpGet:
            path: /ping
            port: 4180
          initialDelaySeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: tempo-oauth2-proxy
  namespace: oauth2-proxy
  labels:
    app: tempo-oauth2-proxy
spec:
  ports:
  - port: 4180
    targetPort: 4180
    name: http
  selector:
    app: tempo-oauth2-proxy

---
# HTTPRoute for Tempo through OAuth2 Proxy
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-authenticated
  namespace: oauth2-proxy
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "tempo.localtest.me"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: tempo-oauth2-proxy
      port: 4180


# Secret keycloak-tempo-client-secret is created by the keycloak-config job
# See: components/platform/keycloak/post-install-job.yaml
