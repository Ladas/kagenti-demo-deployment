# OAuth2 Proxy Cookie Secret
# This secret is used by oauth2-proxy to encrypt cookies
# The cookie secret must be 16, 24, or 32 bytes to create an AES cipher
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: oauth2-proxy
type: Opaque
stringData:
  # 32-byte random value (exactly 32 characters)
  # Generate with: openssl rand -base64 32 | head -c 32
  cookie-secret: "kagenti-demo-oauth2-cookie-str32"
