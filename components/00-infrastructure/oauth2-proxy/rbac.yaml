# RBAC for OAuth2-Proxy InitContainers
# Allows default ServiceAccount to GET secrets for initContainer wait logic
#
# Issue: OAuth2-Proxy deployments have initContainers that wait for Keycloak
# client secrets using `kubectl get secret`. Without RBAC, these initContainers
# cannot see the secrets even though they exist, causing infinite wait loops.
#
# Solution: Grant minimal RBAC (GET secrets only) to default ServiceAccount

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oauth2-proxy-secret-reader
  namespace: oauth2-proxy
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]  # Minimal permissions for initContainer checks

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oauth2-proxy-secret-reader
  namespace: oauth2-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oauth2-proxy-secret-reader
subjects:
- kind: ServiceAccount
  name: default  # OAuth2-Proxy pods use default SA
  namespace: oauth2-proxy
