# OAuth2 Proxy for Kiali
# Protects Kiali UI with Keycloak authentication (kubernetes realm)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali-oauth2-proxy
  namespace: oauth2-proxy
  labels:
    app: kiali-oauth2-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kiali-oauth2-proxy
  template:
    metadata:
      labels:
        app: kiali-oauth2-proxy
    spec:
      initContainers:
      - name: wait-for-secret
        image: bitnami/kubectl:latest
        command:
          - sh
          - -c
          - |
            echo "Waiting for Keycloak client secret kiali-client-secret..."
            until kubectl get secret kiali-client-secret -n oauth2-proxy > /dev/null 2>&1; do
              echo "Secret kiali-client-secret not found, waiting 5s..."
              sleep 5
            done
            echo "Secret kiali-client-secret found, proceeding with deployment"
        securityContext:
          runAsNonRoot: false
      containers:
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.5.1
        args:
          - --provider=oidc
          - --oidc-issuer-url=http://keycloak.keycloak.svc:8080/realms/kubernetes
          - --skip-oidc-discovery=true
          - --client-id=kiali
          - --client-secret=$(CLIENT_SECRET)
          - --redirect-url=https://kiali.localtest.me:9443/oauth2/callback
          - --insecure-oidc-skip-issuer-verification=true
          - --login-url=https://keycloak.localtest.me:9443/realms/kubernetes/protocol/openid-connect/auth
          - --redeem-url=http://keycloak.keycloak.svc:8080/realms/kubernetes/protocol/openid-connect/token
          - --oidc-jwks-url=http://keycloak.keycloak.svc:8080/realms/kubernetes/protocol/openid-connect/certs
          - --upstream=http://kiali.kiali-system.svc:20001
          - --cookie-name=_oauth2_proxy_kiali
          - --cookie-secret=$(COOKIE_SECRET)
          - --cookie-secure=true
          - --email-domain=*
          - --skip-provider-button=true
          - --insecure-oidc-allow-unverified-email=true
          - --http-address=0.0.0.0:4180
        env:
        - name: CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: kiali-client-secret
              key: CLIENT_SECRET
        - name: COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-secrets
              key: cookie-secret
        ports:
        - containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: kiali-oauth2-proxy
  namespace: oauth2-proxy
spec:
  ports:
  - port: 4180
  selector:
    app: kiali-oauth2-proxy
---
# HTTPRoute for Kiali through OAuth2 Proxy
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali-authenticated
  namespace: oauth2-proxy
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: https
  hostnames:
  - "kiali.localtest.me"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kiali-oauth2-proxy
      port: 4180

---
# HTTP to HTTPS redirect for Kiali
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali-http-redirect
  namespace: oauth2-proxy
spec:
  parentRefs:
  - name: external-gateway
    namespace: default
    sectionName: http-redirect
  hostnames:
  - "kiali.localtest.me"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301

# Secret keycloak-kiali-client-secret is created by the keycloak-config job
# See: components/platform/keycloak/post-install-job.yaml
