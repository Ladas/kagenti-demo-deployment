# Cross-Namespace RBAC for Keycloak Secret Access
# Enables copy-admin-secret-job (keycloak namespace) to copy keycloak-initial-admin secret
# to platform namespaces (kagenti-system, observability, etc.)
#
# NOTE: This component has NO namespace: field in kustomization.yaml
#       to preserve explicit namespace declarations below

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-secret-copier
  namespace: keycloak
---
# Role to read keycloak-initial-admin secret in keycloak namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-secret-reader
  namespace: keycloak
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["keycloak-initial-admin"]
  verbs: ["get"]
---
# Role to create secrets in kagenti-system namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-secret-writer
  namespace: kagenti-system
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "update", "patch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-secret-reader
  namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-secret-reader
subjects:
- kind: ServiceAccount
  name: keycloak-secret-copier
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-secret-writer
  namespace: kagenti-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-secret-writer
subjects:
- kind: ServiceAccount
  name: keycloak-secret-copier
  namespace: keycloak
